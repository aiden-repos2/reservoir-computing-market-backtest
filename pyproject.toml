[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reservoir-computing-market-backtest"
version = "1.0.0"
description = "Reproducible implementation of a historical simulated reservoir-computing market backtest"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Aiden Singh", email = "contact.aiden.singh@gmail.com" },
]
keywords = [
  "reservoir computing",
  "backtesting",
  "reproducibility",
  "walk-forward evaluation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[project.scripts]
reservoir-market-backtest = "reservoir_market_backtest.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
